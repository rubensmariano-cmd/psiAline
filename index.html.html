<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aline Mariano - Psicóloga</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            color: #333;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            text-align: center;
            padding: 30px 20px;
        }

        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #4a90e2;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 24px;
            color: #2c3e50;
            margin-bottom: 5px;
        }

        p.subtitle {
            font-size: 14px;
            color: #7f8c8d;
            margin-bottom: 25px;
        }

        .links-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn-link {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background-color: #4a90e2;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .btn-link:hover {
            background-color: #357abd;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(74, 144, 226, 0.4);
        }

        .btn-instagram {
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            box-shadow: 0 4px 10px rgba(220, 39, 67, 0.3);
        }

        .btn-instagram:hover {
            background: linear-gradient(45deg, #e08322 0%, #d5572b 25%, #cb1632 50%, #bb1255 75%, #a80f77 100%);
        }

        .btn-facebook {
            background-color: #1877f2;
            box-shadow: 0 4px 10px rgba(24, 119, 242, 0.3);
        }

        .btn-facebook:hover {
            background-color: #145dbf;
        }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Foto da psicóloga apontando para o arquivo local perfil.jpg -->
        <img src="perfil.jpg" alt="Aline Mariano" class="profile-img">
        
        <h1>Aline Mariano</h1>
        <p class="subtitle">Psicóloga Clínica</p>

        <div class="links-list">
            <a href="https://www.instagram.com/psialinemariano" target="_blank" class="btn-link btn-instagram">
                Instagram (@psialinemariano)
            </a>
            <a href="https://www.facebook.com/Psicoalineguedescardoso" target="_blank" class="btn-link btn-facebook">
                Facebook Profissional
            </a>
            <a href="https://wa.me/" target="_blank" class="btn-link">
                Agende sua Consulta (WhatsApp)
            </a>
        </div>

        <footer>
            &copy; 2026 - Todos os direitos reservados
        </footer>
    </div>

</body>
</html>
